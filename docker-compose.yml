# docker-compose.yml
version: '3.8'

services:
  mqtt-broker:
    image: eclipse-mosquitto:2.0
    container_name: ecg-mqtt-broker
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf
    restart: unless-stopped

  # Opcional: MQTT Explorer web (para debugging)
  mqtt-explorer:
    image: smeagolworms4/mqtt-explorer
    container_name: mqtt-explorer
    ports:
      - "4000:4000"
    depends_on:
      - mqtt-broker